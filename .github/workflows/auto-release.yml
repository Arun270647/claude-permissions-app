name: Auto Release on Main Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:  # Allow manual trigger from Actions tab

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      has_version: ${{ steps.extract.outputs.has_version }}
      patch_notes: ${{ steps.extract.outputs.patch_notes }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Extract version and patch notes from CHANGELOG
      id: extract
      run: |
        git fetch --tags origin

        # Check if [Unreleased] section has content - if so, auto-version it
        HAS_UNRELEASED=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found && /\S/' CHANGELOG.md | head -1)

        if [ -n "$HAS_UNRELEASED" ]; then
          # Auto-calculate next version from latest tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            # Strip 'v' prefix and bump patch
            CURRENT="${LATEST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Auto-versioning [Unreleased] -> [$VERSION] - $(date -u +'%Y-%m-%d')"

          # Replace [Unreleased] with the new version and date
          sed -i "s/^## \[Unreleased\]/## [$VERSION] - $(date -u +'%Y-%m-%d')/" CHANGELOG.md

          # Commit the versioned CHANGELOG
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "chore: Auto-version CHANGELOG to v$VERSION [skip ci]"
          git push origin main

        else
          # Fallback: look for an explicit versioned section not yet tagged
          VERSION=$(grep '## \[' CHANGELOG.md | grep -v 'Unreleased' | head -n 1 | sed 's/## \[\(.*\)\].*/\1/')

          if [ -z "$VERSION" ]; then
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "No version found in CHANGELOG.md"
            exit 0
          fi
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Found version: $VERSION"

        # Check if tag already exists
        if git rev-parse "v$VERSION" >/dev/null 2>&1; then
          echo "has_version=false" >> $GITHUB_OUTPUT
          echo "Tag v$VERSION already exists, skipping release"
          exit 0
        fi

        echo "has_version=true" >> $GITHUB_OUTPUT

        # Extract patch notes for this version
        awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found" CHANGELOG.md | head -c 4000 > patch_notes.txt

        # Set output using delimiter
        echo "patch_notes<<PATCH_EOF" >> $GITHUB_OUTPUT
        cat patch_notes.txt >> $GITHUB_OUTPUT
        echo "PATCH_EOF" >> $GITHUB_OUTPUT

  build-windows:
    needs: detect-version
    if: needs.detect-version.outputs.has_version == 'true'
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Windows dependencies
      run: |
        dotnet restore src/Windows/ClaudePermissionAssistant.Automation/ClaudePermissionAssistant.Automation.csproj -r win-x64
        dotnet restore src/Windows/ClaudePermissionAssistant.App/ClaudePermissionAssistant.App.csproj -r win-x64

    - name: Run tests
      run: dotnet test --configuration Release --verbosity minimal

    - name: Publish Windows app
      run: |
        dotnet publish src/Windows/ClaudePermissionAssistant.App/ClaudePermissionAssistant.App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:Version=${{ needs.detect-version.outputs.version }} `
          -o publish/win-x64

    - name: Rename Windows executable
      shell: bash
      run: mv publish/win-x64/ClaudePrompter.exe publish/win-x64/ClaudePrompter-Windows-v${{ needs.detect-version.outputs.version }}.exe

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: publish/win-x64/ClaudePrompter-Windows-v${{ needs.detect-version.outputs.version }}.exe
        retention-days: 90

  build-macos:
    needs: detect-version
    if: needs.detect-version.outputs.has_version == 'true'
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore macOS dependencies
      run: |
        dotnet restore src/macOS/ClaudePermissionAssistant.MacOS/ClaudePermissionAssistant.MacOS.csproj -r osx-${{ matrix.arch }}
        dotnet restore src/macOS/ClaudePermissionAssistant.MacApp/ClaudePermissionAssistant.MacApp.csproj -r osx-${{ matrix.arch }}

    - name: Publish macOS app
      run: |
        dotnet publish src/macOS/ClaudePermissionAssistant.MacApp/ClaudePermissionAssistant.MacApp.csproj \
          -c Release \
          -r osx-${{ matrix.arch }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:Version=${{ needs.detect-version.outputs.version }} \
          -o publish/osx-${{ matrix.arch }}

    - name: Create .app bundle
      run: |
        APP_NAME="ClaudePrompter"
        APP_BUNDLE="publish/${APP_NAME}.app"

        # Create bundle structure
        mkdir -p "${APP_BUNDLE}/Contents/MacOS"
        mkdir -p "${APP_BUNDLE}/Contents/Resources"

        # Copy executable
        cp "publish/osx-${{ matrix.arch }}/${APP_NAME}" "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
        chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

        # Create Info.plist
        cat > "${APP_BUNDLE}/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>ClaudePrompter</string>
            <key>CFBundleIdentifier</key>
            <string>com.claudeprompter.app</string>
            <key>CFBundleName</key>
            <string>Claude Prompter</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.detect-version.outputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.detect-version.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
        </dict>
        </plist>
        EOF

    - name: Create DMG package
      run: |
        APP_NAME="ClaudePrompter"
        DMG_NAME="ClaudePrompter-macOS-${{ matrix.arch }}-v${{ needs.detect-version.outputs.version }}.dmg"
        TEMP_DMG="publish/temp.dmg"

        # Create temporary DMG
        hdiutil create -volname "${APP_NAME}" \
                       -srcfolder "publish/${APP_NAME}.app" \
                       -ov -format UDRW \
                       "${TEMP_DMG}"

        # Convert to compressed DMG
        hdiutil convert "${TEMP_DMG}" \
                        -format UDZO \
                        -o "publish/${DMG_NAME}"

        # Clean up temp DMG
        rm "${TEMP_DMG}"

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-release-${{ matrix.arch }}
        path: publish/ClaudePrompter-macOS-${{ matrix.arch }}-v${{ needs.detect-version.outputs.version }}.dmg
        retention-days: 90

  create-release:
    needs: [detect-version, build-windows, build-macos]
    if: needs.detect-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Create release notes from CHANGELOG
      run: |
        cat > release-notes.md << 'HEADER'
        ## 🎉 Release v${{ needs.detect-version.outputs.version }}

        ### 📦 Downloads

        **Windows (10/11):**
        - `ClaudePrompter-Windows-v${{ needs.detect-version.outputs.version }}.exe` - Just download and run!

        **macOS:**
        - `ClaudePrompter-macOS-arm64-v${{ needs.detect-version.outputs.version }}.dmg` - Apple Silicon (M1/M2/M3/M4)
        - `ClaudePrompter-macOS-x64-v${{ needs.detect-version.outputs.version }}.dmg` - Intel Macs

        ### 🚀 Installation

        **Windows:**
        1. Download the `.exe` file
        2. Double-click to run
        3. Click "More info" → "Run anyway" if SmartScreen appears

        **macOS:**
        1. Download the `.dmg` file for your Mac
        2. Open the DMG
        3. Drag `ClaudePrompter.app` to Applications folder
        4. Right-click the app → "Open" (first time only to bypass security)
        5. Grant Accessibility permissions when prompted

        ---

        ## 📝 What's New

        HEADER

        # Append patch notes from CHANGELOG.md
        echo "${{ needs.detect-version.outputs.patch_notes }}" >> release-notes.md

        # Add footer
        cat >> release-notes.md << 'FOOTER'

        ---

        ### 🔄 Auto-Update

        If you already have a previous version installed, the app will automatically check for updates on launch.

        **Full documentation:** https://github.com/Arun270647/claude-permissions-app#readme
        FOOTER

    - name: Create GitHub Release
      # This action creates the tag via GitHub API (bypasses git push workflow permission restriction)
      # No separate "git tag && git push" step needed
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.detect-version.outputs.version }}
        name: v${{ needs.detect-version.outputs.version }}
        files: |
          release-assets/windows-release/*
          release-assets/macos-release-arm64/*
          release-assets/macos-release-x64/*
        body_path: release-notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Write patch notes to file for manifest generation
      run: |
        cat > patch_notes_raw.txt << 'PATCH_EOF'
        ${{ needs.detect-version.outputs.patch_notes }}
        PATCH_EOF
        head -c 500 patch_notes_raw.txt | jq -Rs . > patch_notes_json.txt

    - name: Generate Windows update manifest with checksum
      run: |
        VERSION="${{ needs.detect-version.outputs.version }}"
        WINDOWS_FILE="release-assets/windows-release/ClaudePrompter-Windows-v${VERSION}.exe"
        CHECKSUM=$(sha256sum "$WINDOWS_FILE" | awk '{print $1}')
        PATCH_NOTES_JSON=$(cat patch_notes_json.txt)

        jq -n \
          --arg ver "$VERSION" \
          --arg url "https://github.com/Arun270647/claude-permissions-app/releases/download/v${VERSION}/ClaudePrompter-Windows-v${VERSION}.exe" \
          --arg checksum "$CHECKSUM" \
          --arg changelog "See release notes at https://github.com/Arun270647/claude-permissions-app/releases/tag/v${VERSION}" \
          --arg patchNotes "$(cat patch_notes_raw.txt | head -c 500)" \
          --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          '{version: $ver, url: $url, checksum: $checksum, changelog: $changelog, patchNotes: $patchNotes, publishedAt: $publishedAt, mandatory: false}' \
          > latest-windows.json

    - name: Generate macOS arm64 update manifest with checksum
      run: |
        VERSION="${{ needs.detect-version.outputs.version }}"
        MACOS_FILE="release-assets/macos-release-arm64/ClaudePrompter-macOS-arm64-v${VERSION}.dmg"
        CHECKSUM=$(sha256sum "$MACOS_FILE" | awk '{print $1}')

        jq -n \
          --arg ver "$VERSION" \
          --arg url "https://github.com/Arun270647/claude-permissions-app/releases/download/v${VERSION}/ClaudePrompter-macOS-arm64-v${VERSION}.dmg" \
          --arg checksum "$CHECKSUM" \
          --arg changelog "See release notes at https://github.com/Arun270647/claude-permissions-app/releases/tag/v${VERSION}" \
          --arg patchNotes "$(cat patch_notes_raw.txt | head -c 500)" \
          --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          '{version: $ver, url: $url, checksum: $checksum, changelog: $changelog, patchNotes: $patchNotes, publishedAt: $publishedAt, mandatory: false}' \
          > latest-macos-arm64.json

    - name: Generate macOS x64 update manifest with checksum
      run: |
        VERSION="${{ needs.detect-version.outputs.version }}"
        MACOS_FILE="release-assets/macos-release-x64/ClaudePrompter-macOS-x64-v${VERSION}.dmg"
        CHECKSUM=$(sha256sum "$MACOS_FILE" | awk '{print $1}')

        jq -n \
          --arg ver "$VERSION" \
          --arg url "https://github.com/Arun270647/claude-permissions-app/releases/download/v${VERSION}/ClaudePrompter-macOS-x64-v${VERSION}.dmg" \
          --arg checksum "$CHECKSUM" \
          --arg changelog "See release notes at https://github.com/Arun270647/claude-permissions-app/releases/tag/v${VERSION}" \
          --arg patchNotes "$(cat patch_notes_raw.txt | head -c 500)" \
          --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          '{version: $ver, url: $url, checksum: $checksum, changelog: $changelog, patchNotes: $patchNotes, publishedAt: $publishedAt, mandatory: false}' \
          > latest-macos-x64.json

    - name: Commit update manifests to main
      continue-on-error: true
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git fetch origin main
        git checkout main
        git pull origin main
        git add latest-*.json
        git commit -m "chore: Update manifests for v${{ needs.detect-version.outputs.version }} [skip ci]" || echo "No changes to commit"
        git push origin main || echo "Warning: Could not push manifests (workflow permission restriction). Manifests will be updated on next manual push."

    - name: Trigger website deployment (Vercel)
      if: always()
      run: |
        # Trigger Vercel redeployment via webhook (if configured)
        if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        else
          echo "Vercel deploy hook not configured - website will update on next commit"
        fi
