name: Build macOS

on:
  push:
    branches:
      - macos
      - main
    paths:
      - 'src/macOS/**'
      - 'src/Shared/**'
      - '.github/workflows/build-macos.yml'

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal
      continue-on-error: true

    - name: Publish macOS app
      run: |
        dotnet publish src/macOS/ClaudePermissionAssistant.MacApp/ClaudePermissionAssistant.MacApp.csproj \
          -c Release \
          -r osx-${{ matrix.arch }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o publish/osx-${{ matrix.arch }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-${{ matrix.arch }}
        path: publish/osx-${{ matrix.arch }}/ClaudePermissionAssistant
        retention-days: 90
