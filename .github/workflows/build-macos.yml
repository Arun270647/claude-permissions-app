name: Build macOS

on:
  push:
    branches:
      - macos
      - main
    paths:
      - 'src/macOS/**'
      - 'src/Shared/**'
      - '.github/workflows/build-macos.yml'

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Publish macOS app
      run: |
        dotnet publish src/macOS/ClaudePermissionAssistant.MacApp/ClaudePermissionAssistant.MacApp.csproj \
          -c Release \
          -r osx-${{ matrix.arch }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o publish/osx-${{ matrix.arch }}

    - name: Get version from csproj
      id: version
      run: |
        VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/macOS/ClaudePermissionAssistant.MacApp/ClaudePermissionAssistant.MacApp.csproj || echo "1.0.0")
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Rename executable
      run: |
        cd publish/osx-${{ matrix.arch }}
        mv ClaudePermissionAssistant ClaudePermissionAssistant-macOS-${{ matrix.arch }}-v${{ steps.version.outputs.VERSION }}
        chmod +x ClaudePermissionAssistant-macOS-${{ matrix.arch }}-v${{ steps.version.outputs.VERSION }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-${{ matrix.arch }}-v${{ steps.version.outputs.VERSION }}
        path: publish/osx-${{ matrix.arch }}/ClaudePermissionAssistant-macOS-${{ matrix.arch }}-v${{ steps.version.outputs.VERSION }}
        retention-days: 90

    - name: Create/Update Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: v${{ steps.version.outputs.VERSION }}
        files: publish/osx-${{ matrix.arch }}/ClaudePermissionAssistant-macOS-${{ matrix.arch }}-v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update latest-macos.json
      if: github.ref == 'refs/heads/main' && matrix.arch == 'arm64'
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/ClaudePermissionAssistant-macOS-arm64-v${VERSION}"
        cat > latest-macos.json <<EOF
        {
          "version": "${VERSION}",
          "url": "${DOWNLOAD_URL}",
          "changelog": "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}",
          "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        }
        EOF

    - name: Upload update manifest
      if: github.ref == 'refs/heads/main' && matrix.arch == 'arm64'
      uses: actions/upload-artifact@v4
      with:
        name: update-manifest-macos
        path: latest-macos.json
