name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows executable
        run: |
          dotnet publish src/Windows/ClaudePermissionAssistant.App/ClaudePermissionAssistant.App.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64

      - name: Remove PDB files
        run: Remove-Item -Path publish/win-x64/*.pdb -Force -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: publish/win-x64/ClaudePermissionAssistant.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [osx-x64, osx-arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build macOS executable
        run: |
          dotnet publish src/macOS/ClaudePermissionAssistant.MacApp/ClaudePermissionAssistant.MacApp.csproj \
            -c Release -r ${{ matrix.arch }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/${{ matrix.arch }}

      - name: Make executable
        run: chmod +x publish/${{ matrix.arch }}/ClaudePermissionAssistant

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: publish/${{ matrix.arch }}/ClaudePermissionAssistant

  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test --verbosity normal

  create-release:
    name: Create Release
    needs: [build-windows, build-macos, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-osx-arm64
          path: artifacts/macos-arm64

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-osx-x64
          path: artifacts/macos-x64

      - name: Rename files with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv artifacts/windows/ClaudePermissionAssistant.exe \
             artifacts/ClaudePermissionAssistant-Windows-x64-v$VERSION.exe
          mv artifacts/macos-arm64/ClaudePermissionAssistant \
             artifacts/ClaudePermissionAssistant-macOS-arm64-v$VERSION
          mv artifacts/macos-x64/ClaudePermissionAssistant \
             artifacts/ClaudePermissionAssistant-macOS-x64-v$VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ClaudePermissionAssistant-Windows-x64-v*.exe
            artifacts/ClaudePermissionAssistant-macOS-arm64-v*
            artifacts/ClaudePermissionAssistant-macOS-x64-v*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
