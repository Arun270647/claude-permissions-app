name: Build Windows

on:
  push:
    branches:
      - windows
      - main
    paths:
      - 'src/Windows/**'
      - 'src/Shared/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Windows dependencies
      run: |
        dotnet restore src/Windows/ClaudePermissionAssistant.Automation/ClaudePermissionAssistant.Automation.csproj -r win-x64
        dotnet restore src/Windows/ClaudePermissionAssistant.App/ClaudePermissionAssistant.App.csproj -r win-x64

    - name: Build Windows app
      run: dotnet build src/Windows/ClaudePermissionAssistant.App/ClaudePermissionAssistant.App.csproj --configuration Release -r win-x64 --no-restore

    - name: Publish Windows app
      run: |
        dotnet publish src/Windows/ClaudePermissionAssistant.App/ClaudePermissionAssistant.App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o publish/win-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: publish/win-x64/ClaudePermissionAssistant.exe
        retention-days: 90
